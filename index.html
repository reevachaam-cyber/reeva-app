<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>REEVA</title>
<style>
html,body{margin:0;height:100%;background:#FBF8EA;color:#0B2447;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
#rv{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;font-size:18px;text-align:center;padding:0 24px}
#rv b{font-size:22px;letter-spacing:.5px;color:#00387A}
button{font:inherit;padding:12px 22px;border-radius:12px;border:2px solid #00387A;background:#00387A;color:#fff}
/* M4 โครงกระดูกตอนโหลด / loading skeleton (หน้าตาเดียวกับในแอป) */
#sk{padding:0 0 16px}
#sk .skh{background:#003B7A;color:#fff;padding:18px 16px 14px;border-radius:0 0 18px 18px;border-bottom:4px solid #F7D46B}
#sk .skh b{display:block;font-size:20px;letter-spacing:.5px}
#sk .skh span{font-size:14px;opacity:.85}
#sk .skb{height:84px;margin:14px 12px 0;border-radius:16px;background:#E3E8F0;animation:skp 1.2s ease-in-out infinite}
@keyframes skp{0%,100%{opacity:1}50%{opacity:.45}}
</style></head>
<body><div id="sk"><div class="skh"><b>REEVA</b><span>กำลังโหลด... / Loading...</span></div><div class="skb"></div><div class="skb"></div><div class="skb"></div></div>
<div id="rv"></div>
<script>
(function () {
  // ตัวโหลดเล็ก REEVA v4 (20 พ.ย.) · = v3 + เก็บ token 3 ที่ (localStorage + cookie + IndexedDB, ซ่อมตัวเอง) + แถบ "อนุญาตเครื่องนี้ไว้ก่อน" (ไม่บล็อกการใช้งาน)
  // tiny loader v4: v3 + the device token is kept in 3 places (localStorage + cookie + IndexedDB, self-repairing, the first command waits for IndexedDB when needed)
  // + a small non-blocking top bar "Approve this device" for gated roles while device_gate is still 0 (button sends the card to the user's own LINE; dismiss = hidden 24 h).
  // ตัวโหลดเล็ก REEVA v3 (19 พ.ย.) · = v2 + ประตูเครื่อง (device gate / อนุญาตเครื่องใหม่ผ่าน LINE)
  // tiny loader v3: v2 + device gate. When the server answers [DEVICE_NEW] it shows "waiting for approval in LINE", polls every 3 s,
  // stores the device token (localStorage + cookie, 180 days) and sends it as K~token on every call. Same flow as the in-app (HtmlService) pages.
  // v2 features kept: caches the app shell, prefetches home data IN PARALLEL with the shell, remembers the role of every key opened before.
  var EXEC = 'https://script.google.com/macros/s/AKfycbxNnGCJFKM_3-qrYSlkwTGeu71aF_VXMXxUcy9SJsvS7xY59uPyBm-aYE9GLJW03x5_/exec';
  var T0 = Date.now();
  var P = new URLSearchParams(location.search), H = new URLSearchParams(location.hash.replace(/^#/, ''));
  function g(n) { return H.get(n) || P.get(n) || ''; }
  // VIEW ว่างได้ = ให้เลือกหน้าแรกตามบทบาทตอนเปิด (M4.2) / empty = pick home page by role at boot
  var KEY = g('k'), VIEW = g('v'), HSEL = g('h'), SEC = g('s');
  var HOME = { manager: 'minbox', ceo: 'mceo', admin: 'minbox', owner: 'ohome' };
  var GD = /^\d{4}-\d{2}-\d{2}$/.test(g('d')) ? g('d') : '';
  var root = document.getElementById('rv');

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function hash(s) { var h = 5381, i; for (i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }
  function clearSwr() {
    try { var del = [], i, k; for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); if (k && k.indexOf('rv_c_') === 0) del.push(k); } del.forEach(function (x) { localStorage.removeItem(x); }); } catch (e) {}
  }
  function show(msg, retry) {
    var sk = document.getElementById('sk'); if (sk) sk.style.display = 'none';
    root.style.display = 'flex';
    root.innerHTML = '<b>REEVA</b><div></div>' + (retry ? '<button id="rb">ลองอีกครั้ง / Retry</button>' : '');
    root.children[1].textContent = msg;
    if (retry) document.getElementById('rb').onclick = function () { location.reload(); };
  }

  // ?r=1 = ล้างแคชหน้า/บทบาท (ไม่ล้าง device token เด็ดขาด / never clears the device token)
  if (g('r') === '1') { clearSwr(); lsDel('rv_shell'); lsDel('rv_role'); lsDel('rv_roles'); }
  if (!KEY) { show('ลิงก์ไม่ถูกต้อง / Invalid link'); return; }

  var SWR = { winOwnerHome: 1 };
  var WRITES = { winOwnerSlip: 1, winOwnerRequest: 1, winGuestNotice: 1, winGnUpdate: 1, winGnCancel: 1 };

  // =====================================================================
  // ประตูเครื่อง / device gate (v205-sec ฝั่งเซิร์ฟเวอร์ · เก็บ token ฝั่งเครื่องนี้)
  // =====================================================================
  var DKEY = 'rv_dt_' + hash(KEY), QKEY = 'rv_dq_' + hash(KEY), BXKEY = 'rv_dbx_' + hash(KEY), BOKEY = 'rv_dbo_' + hash(KEY), MEM = '', IDBT = '', busy = null, cur = null, soft = null, bdis = 0, bst = null;
  function ckGet(n) { try { var a = document.cookie.split('; '), i; for (i = 0; i < a.length; i++) { if (a[i].indexOf(n + '=') === 0) return decodeURIComponent(a[i].slice(n.length + 1)); } } catch (e) {} return ''; }
  function ckSet(n, v) { try { document.cookie = n + '=' + (v ? encodeURIComponent(v) : '') + '; path=/; max-age=' + (v ? 15552000 : 0) + '; SameSite=Lax; Secure'; } catch (e) {} }
  function okTok(t) { return !!t && t.length === 48 && !/[^0-9a-f]/.test(t); }
  // v4: IndexedDB เป็นที่เก็บที่ 3 (ถ้า localStorage/คุกกี้ถูกล้าง ยังกู้ได้) / IndexedDB is the 3rd store
  function idbOpen(cb) {
    try {
      var r = window.indexedDB.open('rvdg', 1);
      r.onupgradeneeded = function () { try { r.result.createObjectStore('k'); } catch (e) {} };
      r.onsuccess = function () { cb(r.result); };
      r.onerror = function () { cb(null); };
      r.onblocked = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function idbGet(k, cb) {
    idbOpen(function (db) {
      if (!db) { cb(''); return; }
      try {
        var q = db.transaction('k', 'readonly').objectStore('k').get(k);
        q.onsuccess = function () { var v = q.result; try { db.close(); } catch (e) {} cb(typeof v === 'string' ? v : ''); };
        q.onerror = function () { try { db.close(); } catch (e) {} cb(''); };
      } catch (e) { try { db.close(); } catch (e2) {} cb(''); }
    });
  }
  function idbSet(k, v) {
    idbOpen(function (db) {
      if (!db) { return; }
      try {
        var tx = db.transaction('k', 'readwrite'), os = tx.objectStore('k');
        if (v) { os.put(v, k); } else { os['delete'](k); }
        tx.oncomplete = function () { try { db.close(); } catch (e) {} };
        tx.onerror = function () { try { db.close(); } catch (e) {} };
        tx.onabort = function () { try { db.close(); } catch (e) {} };
      } catch (e) { try { db.close(); } catch (e2) {} }
    });
  }
  function dtGet() {
    var c = [MEM, lsGet(DKEY), ckGet(DKEY), IDBT], i;
    for (i = 0; i < c.length; i++) { if (okTok(c[i] || '')) { return c[i]; } }
    return '';
  }
  function dtSave(t) { MEM = t || ''; IDBT = t || ''; if (t) { lsSet(DKEY, t); ckSet(DKEY, t); idbSet(DKEY, t); } else { lsDel(DKEY); ckSet(DKEY, ''); idbSet(DKEY, ''); } }
  // READY = รู้แล้วว่ามี token ไหม: ถ้าเจอใน localStorage/คุกกี้ทันที ไม่ต้องรอ · ถ้าไม่เจอ รอ IndexedDB (สูงสุด 900 ms) ก่อนคำสั่งแรก
  // READY = we know whether a token exists: instant when found in localStorage/cookie, otherwise wait for IndexedDB (max 900 ms) before the first command
  var READY = new Promise(function (resolve) {
    var done = false;
    function fin() { if (done) { return; } done = true; resolve(); }
    if (dtGet()) { fin(); }
    else {
      setTimeout(fin, 900);
      if (!window.indexedDB) { fin(); }
      else { idbGet(DKEY, function (v) { if (okTok(v)) { IDBT = v; } fin(); }); }
    }
  });
  // ซ่อมตัวเอง: เจอที่ไหนที่หนึ่ง เขียนให้ครบทั้ง 3 ที่ / self-repair: found in any store -> write all three
  READY.then(function () { var t = dtGet(); if (t) { dtSave(t); } });
  // คีย์ที่ส่งไปเซิร์ฟเวอร์: K หรือ K~token · โค้ด View as (va.) ไม่ใช้ token / wire key: K or K~token (View-as va. codes never carry one)
  function wireKey() { var t = KEY.indexOf('va.') === 0 ? '' : dtGet(); return t ? KEY + '~' + t : KEY; }
  function isNew(e) { return String((e && e.message) || e || '').indexOf('[DEVICE_NEW]') >= 0; }
  function msgOf(e) { return String((e && e.message) || e || '').replace(/^Error: /, ''); }
  function el(t, st, tx) { var e = document.createElement(t); if (st) { e.style.cssText = st; } if (tx != null) { e.textContent = tx; } return e; }
  function lab() {
    var u = String((window.navigator && window.navigator.userAgent) || '');
    var os = /iPhone|iPad|iPod/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac OS X|Macintosh/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : 'Other';
    var br = /Line\//.test(u) ? 'LINE' : /EdgA?\//.test(u) ? 'Edge' : /OPR\/|Opera/.test(u) ? 'Opera' : /SamsungBrowser/.test(u) ? 'Samsung' : /Firefox|FxiOS/.test(u) ? 'Firefox' : /CriOS|Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : 'Browser';
    return os + ' · ' + br;
  }
  function dgUi() {
    var o = document.getElementById('dgov');
    if (!o) {
      o = el('div', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#FBF8EA;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif');
      o.id = 'dgov';
      var c = el('div', 'max-width:380px;width:100%;background:#fff;border:1px solid #D9E2EF;border-radius:16px;padding:22px;text-align:center;color:#00387A');
      var i = el('div', 'font-size:34px', ''); i.id = 'dgi';
      var t = el('div', 'font-size:17px;font-weight:700;margin:8px 0 4px;white-space:pre-line', ''); t.id = 'dgt';
      var s = el('div', 'font-size:13px;color:#52607A;line-height:1.5;white-space:pre-line', ''); s.id = 'dgs';
      var b = el('div', 'margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap'); b.id = 'dgb';
      c.appendChild(i); c.appendChild(t); c.appendChild(s); c.appendChild(b); o.appendChild(c);
      (document.body || document.documentElement).appendChild(o);
    }
    return o;
  }
  function dgShow(ic, ti, su, btns) {
    cur = [ic, ti, su, btns];
    dgUi();
    document.getElementById('dgi').textContent = ic; document.getElementById('dgt').textContent = ti; document.getElementById('dgs').textContent = su;
    var b = document.getElementById('dgb'); while (b.firstChild) { b.removeChild(b.firstChild); }
    (btns || []).forEach(function (x) {
      var bt = el('button', 'border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;' + (x[2] ? 'background:#00387A;color:#fff' : 'background:#E8EDF5;color:#00387A'), x[0]);
      bt.onclick = x[1]; b.appendChild(bt);
    });
  }
  function dgHide() { cur = null; var o = document.getElementById('dgov'); if (o && o.parentNode) { o.parentNode.removeChild(o); } }
  // หน้าถูกเขียนทับด้วย document.write ตอนเปิดแอป → วาดหน้ารออีกครั้ง / the page is replaced by document.write at boot -> redraw the waiting screen
  function dgRedraw() { if (cur && !document.getElementById('dgov')) { dgShow(cur[0], cur[1], cur[2], cur[3]); } barRedraw(); }

  function rawCall(fn, a, k) {
    return fetch(EXEC + '?page=api', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, k: k, a: a }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.e) || 'error'); return j.d; }, function () { throw new Error('เชื่อมต่อไม่ได้ / Connection failed'); });
  }

  // ขอ + รออนุญาตทาง LINE (ครั้งละ 1 รอบ แม้มีหลายคำสั่งชนกัน) / ask + wait for LINE approval (single flight)
  function run(ok, no) {
    var q = null, timer = 0, dead = false;
    try { q = JSON.parse(lsGet(QKEY) || 'null'); } catch (e) { q = null; }
    if (q && (!q.id || !q.n || Number(q.exp) < Date.now())) { q = null; }
    function fin(good, e) { dead = true; if (timer) { clearTimeout(timer); } lsDel(QKEY); dgHide(); if (good) { ok(); } else { no(e); } }
    function cancel() { fin(false, new Error('ยกเลิก / Cancelled')); }
    function ask() {
      dgShow('⏳', 'รอเจ้าของอนุญาตทาง LINE\nWaiting for approval in LINE', 'กำลังส่งคำขอ… / Sending request…', [['ยกเลิก / Cancel', cancel]]);
      rawCall('dgRequest', [{ l: lab(), p: 'loader:' + (VIEW || 'home') }], KEY).then(function (r) {
        if (dead) { return; }
        q = { id: r.id, n: r.n, exp: r.exp }; lsSet(QKEY, JSON.stringify(q)); wait();
      }, function (e) {
        if (dead) { return; }
        dgShow('⚠️', 'ส่งคำขอไม่สำเร็จ\nCould not send the request', msgOf(e), [['ลองใหม่ / Retry', ask, 1], ['ปิด / Close', cancel]]);
      });
    }
    function wait() {
      dgShow('⏳', 'รอเจ้าของอนุญาตทาง LINE\nWaiting for approval in LINE', 'เปิด LINE แล้วกด "✅ อนุญาตเครื่องนี้" ในแชท REEVA (ไม่ต้องพิมพ์รหัส)\nOpen LINE and tap "Allow this device" in the REEVA chat (no code needed)', [['ยกเลิก / Cancel', cancel]]);
      tick();
    }
    function again(ic, ti, su) { lsDel(QKEY); q = null; dgShow(ic, ti, su, [['ขอใหม่ / Ask again', ask, 1], ['ปิด / Close', cancel]]); }
    function tick() {
      if (dead) { return; }
      dgRedraw();
      if (q && Date.now() > Number(q.exp) + 5000) { again('⌛', 'คำขอหมดอายุ\nRequest expired', ''); return; }
      rawCall('dgPoll', [q.id, q.n], KEY).then(function (r) {
        if (dead) { return; }
        if (r && r.st === 'ok' && r.dt) { dtSave(r.dt); fin(true); return; }
        if (r && r.st === 'wait') { timer = setTimeout(tick, 3000); return; }
        var st = r ? r.st : '';
        if (st === 'no') { again('⛔', 'ถูกปฏิเสธ\nDenied', 'เจ้าของกด "ไม่ใช่ฉัน" / The owner tapped "Not me"'); }
        else if (st === 'exp') { again('⌛', 'คำขอหมดอายุ\nRequest expired', ''); }
        else if (st === 'lost') { timer = setTimeout(function () { if (dead) { return; } if (dtGet()) { fin(true); } else { again('⚠️', 'ขอใหม่อีกครั้ง\nPlease ask again', 'คำขอเดิมใช้ต่อไม่ได้ / The previous request cannot be continued'); } }, 900); } // v4: โทเคนถูกแถบเล็กรับไปแล้ว (มาครั้งเดียว) / the small bar already received the one-time token
        else { again('⚠️', 'ขอใหม่อีกครั้ง\nPlease ask again', 'คำขอเดิมใช้ต่อไม่ได้ / The previous request cannot be continued'); }
      }, function () { if (dead) { return; } timer = setTimeout(tick, 5000); });
    }
    if (q) { wait(); } else { ask(); }
  }
  function approve() {
    if (busy) { return busy; }
    softStop();
    busy = new Promise(function (ok, no) { run(ok, no); });
    busy.then(function () { busy = null; barHide(); }, function () { busy = null; });
    return busy;
  }
  // noAsk = ดึงล่วงหน้าตอนเปิด: ถ้าเครื่องใหม่ ให้เงียบไว้ก่อน (ยังไม่รู้บทบาท · แอดมินจะถูกเด้งไปหลังบ้านอยู่แล้ว) / boot-time prefetch: stay silent on a new device
  function call(fn, a, noAsk) {
    return READY.then(function () { return rawCall(fn, a, wireKey()); }).catch(function (e) {
      if (!isNew(e) || noAsk) { throw e; }
      if (dtGet()) { dtSave(''); } // token เดิมใช้ไม่ได้ (หมดอายุ/ถูกลบ/คีย์ถูกรีเซ็ต) / the old token no longer works
      return approve().then(function () { return rawCall(fn, a, wireKey()); });
    });
  }
  // ให้หน้าในแอปที่ใช้ window.DG (เช่นปุ่ม "อนุญาตเครื่องนี้") ทำงานได้บนหน้านี้ด้วย / lets in-app code that uses window.DG work here too
  window.DG = {
    token: dtGet, w: wireKey, isNew: isNew, approve: approve,
    call: function (f) { return READY.then(function () { return f(); }).catch(function (e) { if (!isNew(e)) { throw e; } if (dtGet()) { dtSave(''); } return approve().then(function () { return f(); }); }); }
  };

  // =====================================================================
  // v4: แถบขออนุญาตเครื่องล่วงหน้า (ไม่บล็อก) / early device-approval bar (never blocks use)
  // เงื่อนไข: บทบาทอยู่ในรายการประตูเครื่อง + ยังไม่มี token ที่ใช้ได้ + device_gate=0 (เซิร์ฟเวอร์ตอบผ่าน dgInfo) · ไม่แสดงกับแม่บ้านทั่วไป/เจ้าของ
  // =====================================================================
  function dismissedRecently() { var v = Number(lsGet(BXKEY)) || bdis, n = Date.now(); return !!v && v <= n + 60000 && n - v < 86400000; }
  function softStop() { if (soft) { soft.dead = true; if (soft.timer) { clearTimeout(soft.timer); } soft = null; } }
  function barSet(text, btns, closable) {
    bst = { text: text, btns: btns || [], closable: closable !== false };
    barDraw();
  }
  function barDraw() {
    if (!bst) { return; }
    var b = document.getElementById('dgbar');
    if (!b) {
      b = el('div', 'position:sticky;top:0;left:0;right:0;z-index:2147482000;background:#FFF4CC;color:#00387A;border-bottom:2px solid #F7D46B;padding:7px 10px;font:600 13px/1.35 system-ui,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap');
      b.id = 'dgbar';
      var t = el('span', 'flex:1 1 180px;min-width:0;white-space:pre-line', ''); t.id = 'dgbt';
      var a = el('span', 'display:flex;gap:6px;align-items:center'); a.id = 'dgba';
      b.appendChild(t); b.appendChild(a);
      var p = document.body || document.documentElement;
      p.insertBefore(b, p.firstChild);
    }
    document.getElementById('dgbt').textContent = bst.text;
    var a2 = document.getElementById('dgba'); while (a2.firstChild) { a2.removeChild(a2.firstChild); }
    bst.btns.forEach(function (x) {
      var bt = el('button', 'border:0;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;background:#00387A;color:#fff', x[0]);
      bt.onclick = x[1]; a2.appendChild(bt);
    });
    if (bst.closable) {
      var cx = el('button', 'border:0;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;background:#E8EDF5;color:#00387A', '✕');
      cx.title = 'ซ่อน 24 ชม. / Hide for 24 h'; cx.onclick = barDismiss; a2.appendChild(cx);
    }
  }
  // หน้าถูก document.write ทับตอนเปิดแอป → วาดแถบกลับมา / redraw after the page is replaced at boot
  function barRedraw() { if (bst && !document.getElementById('dgbar')) { barDraw(); } }
  function barHide() { bst = null; var b = document.getElementById('dgbar'); if (b && b.parentNode) { b.parentNode.removeChild(b); } }
  function barDismiss() { bdis = Date.now(); lsSet(BXKEY, String(bdis)); softStop(); barHide(); }
  function barIdle() {
    barSet('🔐 ยังไม่ได้อนุญาตเครื่องนี้ — กดอนุญาตไว้ก่อน จะได้ไม่สะดุดทีหลัง\nThis device is not approved yet. Approve it now so nothing is interrupted later.', [['🔐 อนุญาตเครื่องนี้ / Approve this device', barAsk]]);
  }
  function barAsk() {
    softStop();
    var s = { dead: false, timer: 0, q: null }; soft = s;
    barSet('⏳ กำลังส่งคำขอไปที่ LINE… / Sending the request to LINE…', [], true);
    function fail(ti) { lsDel(QKEY); s.q = null; barSet(ti, [['ขอใหม่ / Ask again', barAsk]]); }
    function tick() {
      if (s.dead) { return; }
      if (Date.now() > Number(s.q.exp) + 5000) { fail('⌛ คำขอหมดอายุ / Request expired'); return; }
      rawCall('dgPoll', [s.q.id, s.q.n], KEY).then(function (r) {
        // token มาครั้งเดียว: ต่อให้ผู้ใช้เปลี่ยนไปใช้หน้ารอแบบบล็อกแล้ว ก็ต้องเก็บไว้ / the token is delivered only once: keep it even if the blocking flow took over meanwhile
        if (r && r.st === 'ok' && r.dt) { dtSave(r.dt); lsDel(QKEY); if (s.dead) { return; } soft = null; lsSet(BOKEY, String(Date.now())); barSet('✅ อนุญาตเครื่องนี้แล้ว / This device is approved', [], false); setTimeout(barHide, 4000); return; }
        if (s.dead) { return; }
        if (r && r.st === 'wait') { s.timer = setTimeout(tick, 3000); return; }
        var st = r ? r.st : '';
        if (st === 'no') { fail('⛔ ถูกปฏิเสธ / Denied'); }
        else if (st === 'exp') { fail('⌛ คำขอหมดอายุ / Request expired'); }
        else { fail('⚠️ คำขอเดิมใช้ต่อไม่ได้ / The previous request cannot be continued'); }
      }, function () { if (s.dead) { return; } s.timer = setTimeout(tick, 5000); });
    }
    rawCall('dgRequest', [{ l: lab(), p: 'loader:' + (VIEW || 'home') + ':bar' }], KEY).then(function (r) {
      if (s.dead) { return; }
      s.q = { id: r.id, n: r.n, exp: r.exp }; lsSet(QKEY, JSON.stringify(s.q));
      barSet('⏳ เปิด LINE แล้วกด "✅ อนุญาตเครื่องนี้" ได้เลย (ใช้งานต่อได้ตามปกติ)\nOpen LINE and tap "Allow this device" (you can keep working)', [], true);
      tick();
    }, function (e) { if (s.dead) { return; } barSet('⚠️ ' + msgOf(e), [['ลองใหม่ / Retry', barAsk]]); });
  }
  function barInit() {
    try {
      if (KEY.indexOf('va.') === 0 || busy || dismissedRecently()) { return; }
      var o = Number(lsGet(BOKEY)) || 0; if (o && Date.now() - o < 21600000 && o <= Date.now() + 60000) { return; }
      rawCall('dgInfo', [], wireKey()).then(function (r) {
        if (r && r.bar === 1) { if (!busy && !dismissedRecently() && !document.getElementById('dgov')) { barIdle(); } }
        else if (r && r.why !== 'err') { lsSet(BOKEY, String(Date.now())); }
      }, function () {});
    } catch (e) {}
  }

  // ---- รู้บทบาทของคีย์นี้จากครั้งก่อนไหม / do we already know this key's role? ----
  var KH = hash(KEY);
  var cs = null, cr = null, rmap = null;
  try { cs = JSON.parse(lsGet('rv_shell') || 'null'); } catch (e) { cs = null; }
  try { cr = JSON.parse(lsGet('rv_role') || 'null'); } catch (e) { cr = null; }
  try { rmap = JSON.parse(lsGet('rv_roles') || 'null'); } catch (e) { rmap = null; }
  if (!rmap || typeof rmap !== 'object') rmap = {};
  var knownRole = (cr && cr.k === KEY) ? (cr.role || '') : (Object.prototype.hasOwnProperty.call(rmap, KH) ? String(rmap[KH]) : null);
  function rememberRole(role) {
    rmap[KH] = role || '';
    var ks = Object.keys(rmap); if (ks.length > 12) { delete rmap[ks[0]]; } // กันบวม / cap size
    lsSet('rv_roles', JSON.stringify(rmap));
  }

  // ---- ดึงข้อมูลหน้าแรก "พร้อมกัน" กับตัวหน้าแอป (ประหยัดไป 1 รอบเรียก Apps Script ~2.5–4 วิ) ----
  // prefetch the home page data in parallel with the shell (saves one Apps Script round trip, ~2.5-4 s)
  // วิวไหนเรียกฟังก์ชันอะไร (ต้องตรงกับในแอปทุกตัวอักษร ถ้าไม่ตรงก็แค่ไม่ได้ใช้ ไม่พัง) / view -> [fn, args] (must match the app; a mismatch just means no benefit)
  var PFMAP = { mjobs: ['winJobs', ['']], minbox: ['winInbox', []], mlead: ['winLead', ['']], mceo: ['winCeo', []], mtoday: ['winToday', []], ohome: ['winOwnerHome', [HSEL]] };
  var pfView = VIEW || (knownRole !== null ? (HOME[knownRole] || 'mjobs') : '');
  var PF = null;
  // แอดมินตัวจริงจะถูกเด้งไปหลังบ้านอยู่แล้ว ไม่ต้องดึง / real admins are redirected to the back office, no prefetch
  if (pfView && PFMAP[pfView] && KEY.indexOf('va.') !== 0 && !(knownRole === 'admin' && g('noadm') !== '1')) {
    PF = { fn: PFMAP[pfView][0], a: PFMAP[pfView][1], used: 0 };
    PF.p = call(PF.fn, PF.a, true); PF.p.catch(function () {}); // กัน unhandled / avoid unhandled rejection (noAsk: เครื่องใหม่ = ไม่ขออนุญาตตอนนี้ รอแอปเรียกจริง)
  }

  window.REEVA_API = function (fn, a) {
    var done = WRITES[fn] ? function (d) { clearSwr(); return d; } : function (d) { return d; };
    if (PF && !PF.used && PF.fn === fn && JSON.stringify(PF.a) === JSON.stringify(a)) {
      PF.used = 1;
      var pp = PF.p;
      if (SWR[fn]) {
        var ck0 = 'rv_c_' + fn + '_' + hash(KEY + '|' + JSON.stringify(a)), raw0 = lsGet(ck0), cached0 = null;
        if (raw0) { try { cached0 = JSON.parse(raw0); } catch (e) { cached0 = null; } }
        if (cached0) {
          pp.then(function (d) { var s = JSON.stringify(d); if (s !== raw0) { lsSet(ck0, s); if (window.REEVA_FRESH) window.REEVA_FRESH(fn, a, d); } }).catch(function () {});
          return Promise.resolve(cached0);
        }
        return pp.then(function (d) { lsSet(ck0, JSON.stringify(d)); return d; }, function () { return call(fn, a); });
      }
      return pp.then(done, function () { return call(fn, a).then(done); }); // ดึงล่วงหน้าพลาด/เครื่องใหม่ = เรียกใหม่ตามปกติ (ขออนุญาตถ้าจำเป็น) / prefetch failed or new device = normal call (asks for approval if needed)
    }
    if (SWR[fn]) {
      var ck = 'rv_c_' + fn + '_' + hash(KEY + '|' + JSON.stringify(a)), raw = lsGet(ck), cached = null;
      if (raw) { try { cached = JSON.parse(raw); } catch (e) { cached = null; } }
      if (cached) {
        call(fn, a).then(function (d) {
          var s = JSON.stringify(d);
          if (s !== raw) { lsSet(ck, s); if (window.REEVA_FRESH) window.REEVA_FRESH(fn, a, d); }
        }).catch(function () {});
        return Promise.resolve(cached);
      }
      return call(fn, a).then(function (d) { lsSet(ck, JSON.stringify(d)); return d; });
    }
    return call(fn, a).then(done);
  };

  function boot(html, role) {
    var vw = VIEW || HOME[role] || 'mjobs';
    var pre = '<script>var KEY=' + JSON.stringify(KEY) + ';var VIEW=' + JSON.stringify(vw) + ';var HSEL=' + JSON.stringify(HSEL) +
      ';var SEC=' + JSON.stringify(SEC) + ';var GD=' + JSON.stringify(GD) + ';var ROLE=' + JSON.stringify(role || '') + ';window.REEVA_T0=' + T0 + ';<\/script>';
    var out = html.replace('<base target="_top">', function (m) { return m + pre; });
    document.open(); document.write(out); document.close();
    dgRedraw();
    READY.then(function () { setTimeout(barInit, 1500); }); // v4: เช็กแถบหลังแอปขึ้น (แอดมินตัวจริงไม่มาถึงตรงนี้ เพราะถูกเด้งไปหลังบ้านก่อน) / check the bar after the app is up
  }
  function fetchShell(have) {
    return fetch(EXEC + '?page=shell&k=' + encodeURIComponent(KEY) + (have ? '&have=' + encodeURIComponent(have) : ''))
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.e) || 'error'); return j; }, function () { throw new Error('เชื่อมต่อไม่ได้ / Connection failed'); });
  }
  function save(j) {
    if (j.h) lsSet('rv_shell', JSON.stringify({ v: j.v, h: j.h }));
    lsSet('rv_role', JSON.stringify({ k: KEY, role: j.role || '' }));
    rememberRole(j.role);
  }

  // แอดมินตัวจริง (ไม่ใช่โค้ด va.) → ไปหลังบ้านหน้าเดียวทันที (หน้านั้นมีประตูเครื่องของมันเอง) / real admin (not a View-as va. code) goes straight to the back office (which has its own device gate)
  function adminGo(role) {
    if (role !== 'admin' || KEY.indexOf('va.') === 0 || g('noadm') === '1') return false;
    var M = { '': 'dash', minbox: 'dash', mpend: 'apv', mcal: 'cal' }, t = Object.prototype.hasOwnProperty.call(M, VIEW) ? M[VIEW] : 'apps';
    var go = (t === 'apps' && VIEW) ? '&go=' + encodeURIComponent(VIEW.replace(/[^a-z0-9_]/gi, '').slice(0, 20)) : '';
    try { document.documentElement.style.display = 'none'; } catch (e) {}
    location.replace(EXEC + '?page=admin&t=' + t + '&k=' + encodeURIComponent(KEY) + go);
    return true;
  }

  if (knownRole !== null && adminGo(knownRole)) return;
  if (cs && cs.h && knownRole !== null) {
    // เปิดซ้ำ หรือสลับกลับมาคีย์ที่เคยเปิด: ขึ้นทันทีจากแคช (ไม่ต้องรอเซิร์ฟเวอร์) / repeat open or switching back to a known key: instant from cache
    var go = function () { boot(cs.h, knownRole); }; if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(go, 0); }); else setTimeout(go, 0); // repeat open: wait until parser is done, else document.open is ignored
    // เช็กเวอร์ชันใหม่เงียบๆ หลังหน้าขึ้นแล้ว (ใช้ครั้งถัดไป) / silently check for a newer shell
    setTimeout(function () { fetchShell(cs.v).then(function (j) { save(j); }).catch(function () {}); }, 4000);
  } else {
    // เปิดครั้งแรกของคีย์นี้ในเครื่อง: ต้องรู้บทบาท (ตัวหน้าแอปถ้ายังไม่มีก็ดึงมาด้วย) — ข้อมูลหน้าแรกวิ่งขนานกันอยู่แล้ว
    // first open of this key on this device: need the role (and the shell if not cached yet) — home data is already running in parallel
    fetchShell(cs && cs.h ? cs.v : '').then(function (j) {
      save(j);
      if (adminGo(j.role)) return;
      var html = j.h || (cs && cs.h) || '';
      if (!html) { show('โหลดไม่สำเร็จ / Could not load', true); return; }
      boot(html, j.role);
    }).catch(function (e) { show((e && e.message) || 'error', true); });
  }
})();
</script></body></html>
